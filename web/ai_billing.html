<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Dawaiflow Instant Theme Bootstrap — Prevents Any White Flash / FOUC -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('expiryguard_theme');
        var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var active = isDark ? 'dark' : 'light';
        var root = document.documentElement;
        root.setAttribute('data-theme', active);
        root.setAttribute('data-theme-preference', saved || 'system');
        root.style.backgroundColor = isDark ? '#0B132B' : '#F8FAFC';
        root.style.colorScheme = active;
      } catch (e) {}
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=billing.html">
  <title>Redirecting to Create New Bill...</title>
  <script>
    window.location.replace('billing.html');
  </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
  <p>Redirecting to <a href="billing.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">Create New Bill</a>...</p>
</body>
</html>
