# ==============================================================================
# Dawaiflow / ExpiryGuard - Production Docker Compose Orchestration
# Subnet-Isolated Database, TLS Reverse Proxy & Rate-Limited FastAPI Cluster
# ==============================================================================

version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Reverse Proxy & TLS Termination (Nginx)
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: dawaiflow_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    networks:
      - dawaiflow_public
    depends_on:
      - backend

  # -------------------------------------------------------------
  # 2. FastAPI Backend Application
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dawaiflow_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://dawaiflow_user:${POSTGRES_PASSWORD}@db:5432/dawaiflow_db
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    networks:
      - dawaiflow_public
      - dawaiflow_db_internal
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------
  # 3. PostgreSQL Database (Strictly Isolated Subnet)
  # -------------------------------------------------------------
  # CRITICAL SECURITY CONFIGURATION:
  # Notice the complete ABSENCE of any 'ports:' directive binding to 0.0.0.0!
  # PostgreSQL is attached ONLY to dawaiflow_db_internal (internal: true).
  # It is completely unreachable from the public internet or host external interfaces.
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dawaiflow_postgres
    restart: always
    environment:
      - POSTGRES_USER=dawaiflow_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=dawaiflow_db
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    expose:
      - "5432"
    networks:
      - dawaiflow_db_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawaiflow_user -d dawaiflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

# -------------------------------------------------------------
# Isolated Docker Networks
# -------------------------------------------------------------
networks:
  # Public-facing network for Nginx and Backend
  dawaiflow_public:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

  # Completely internal network for Database and Backend
  # internal: true disables external gateway routing
  dawaiflow_db_internal:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16

# -------------------------------------------------------------
# Persistent Volumes
# -------------------------------------------------------------
volumes:
  postgres_data:
  uploads_data:
  backups_data:
  nginx_logs:
