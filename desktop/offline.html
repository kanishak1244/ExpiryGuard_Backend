<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DawaiFlow — Internet Required</title>
  <style>
    :root {
      --brand-primary: #10B981;
      --brand-dark: #059669;
      --bg-surface: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-surface: #0F172A;
        --card-bg: #1E293B;
        --text-main: #F8FAFC;
        --text-muted: #94A3B8;
        --border-color: #334155;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-surface);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      background: rgba(16, 185, 129, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px auto;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }
    .brand-title span {
      color: var(--brand-primary);
    }
    .status-message {
      font-size: 14.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-retry {
      background-color: var(--brand-primary);
      color: #FFFFFF;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-retry:hover {
      background-color: var(--brand-dark);
      transform: translateY(-1px);
    }
    .btn-retry:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="brand-icon">🌐</div>
    <h1 class="brand-title">Dawai<span>Flow</span></h1>
    <p class="status-message">
      Internet connection required to use DawaiFlow.<br>
      Please check your network connection and try again.
    </p>
    <button class="btn-retry" onclick="retryConnection()">
      <span>🔄</span> Retry Connection
    </button>
  </div>

  <script>
    function retryConnection() {
      if (window.dawaiflowDesktop && window.dawaiflowDesktop.reload) {
        window.dawaiflowDesktop.reload();
      } else {
        window.location.reload();
      }
    }

    window.addEventListener('online', () => {
      retryConnection();
    });
  </script>
</body>
</html>
