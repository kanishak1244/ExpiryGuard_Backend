# PostgreSQL Client Authentication Configuration File (pg_hba.conf)
# Production Subnet Isolation Configuration for Dawaiflow / ExpiryGuard
#
# CRITICAL SECURITY RULE:
# Never permit unrestricted remote IP addresses or open subnets.
# Only permit local loopback and internal private Docker / VPC subnets.
# Always enforce scram-sha-256 authentication.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# 1. "local" is for Unix domain socket connections only
local   all             all                                     peer

# 2. IPv4 local loopback connections (Localhost only)
host    all             all             127.0.0.1/32            scram-sha-256

# 3. IPv6 local loopback connections (Localhost only)
host    all             all             ::1/128                 scram-sha-256

# 4. Internal Docker Bridge / Private VPC Subnet (FastAPI Backend Container ONLY)
# Replace 172.20.0.0/16 with your specific internal Docker network or private VPC CIDR
host    all             all             172.20.0.0/16           scram-sha-256
host    all             all             10.0.0.0/16             scram-sha-256

# 5. Explicitly REJECT all other connections from any IP
host    all             all             all                     reject
