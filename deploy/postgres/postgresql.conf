# PostgreSQL Production Server Configuration (postgresql.conf)
# Dawaiflow / ExpiryGuard Database Hardening & Subnet Isolation

# -------------------------------------------------------------
# NETWORK & CONNECTION RESTRICTIONS
# -------------------------------------------------------------
# Bind ONLY to localhost and the internal Docker bridge/private VPC interface
# NEVER set listen_addresses = '*' on a server with a public IP address!
listen_addresses = 'localhost,172.20.0.1'
port = 5432
max_connections = 100

# -------------------------------------------------------------
# ENCRYPTION & AUTHENTICATION
# -------------------------------------------------------------
# Enforce modern salted SCRAM-SHA-256 password hashing (replaces insecure md5)
password_encryption = scram-sha-256

# SSL / TLS Wire Encryption
ssl = on
ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'
ssl_ciphers = 'HIGH:!aNULL:!MD5:!3DES'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# -------------------------------------------------------------
# RESOURCE & PERFORMANCE TUNING
# -------------------------------------------------------------
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 1536MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9

# -------------------------------------------------------------
# LOGGING & AUDITING
# -------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
