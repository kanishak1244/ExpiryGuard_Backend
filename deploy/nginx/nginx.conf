user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings
    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log main_json;
    error_log /var/log/nginx/error.log warn;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client Request Limits
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Global Rate Limiting Zones (Shared Memory)
    # 1) Authentication Zone: Max 5 requests/minute per IP to prevent brute-force on /login and /token
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # 2) General API Zone: Max 30 requests/second per IP for standard API usage
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Rate limiting status code (429 Too Many Requests)
    limit_req_status 429;

    # Include Cloudflare Real IP configuration
    include /etc/nginx/conf.d/cloudflare_real_ip.conf;

    # Include Virtual Host configs
    include /etc/nginx/conf.d/*.conf;
}
